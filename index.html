<style>
/* Layout: one-screen instrument panel for an iPhone mounted in portrait — time budget on top, current instruction, then rest plan */
:root{
  --bg:#0d141c; --panel:#152130; --line:#24364a; --fg:#e7eef5; --muted:#8fa3b8;
  --ev:#3fd0c0; --hv:#f0a93b; --glide:#8fb4ff; --regen:#7fdc6a; --warn:#ff7a6b;
  --jp:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Chakra Petch","BIZ UDPGothic",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:max(12px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
/* 縦：2列の枠を外して元の並び順で1列に */
.col{display:contents}
.col>*{order:9}
.col>.status{order:1}.col>.time{order:2}.col>.slack{order:3}.col>#offroute{order:4}.col>#trafficBox{order:5}.col>.jct{order:5}.col>.now{order:6}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--regen)} .dot.bad{background:var(--warn)} .dot.demo{background:var(--glide)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.remain{font-size:15px;color:var(--fg)}

.time{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.t small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.t b{display:block;font-family:var(--num);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.t input{font-family:var(--num);font-size:22px;font-weight:700;background:transparent;color:var(--fg);border:0;padding:0;width:100%;min-width:0}
.slack{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-radius:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sc,var(--regen))}
.slack span{color:var(--muted);font-size:13px}
.slack b{font-family:var(--num);font-size:30px;color:var(--sc,var(--regen));font-variant-numeric:tabular-nums}

.now{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--mc,var(--hv))}
.zone-label{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.zone-name{font-size:20px;font-weight:700;text-wrap:balance;margin-top:2px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.g small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.g b{display:block;font-family:var(--num);font-weight:700;font-size:clamp(24px,8.5vw,38px);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}

<script>
const R=6371;
const $=id=>document.getElementById(id);
const VAL="https://valhalla1.openstreetmap.de"; // 経路・道路の種類・標高（無料・キー不要）
/* ---- 設定（この端末に保存） ---- */
const SET={voice:false,voiceEco:false,sapa:true,area:true,meY:0,ecoRest:false,restMin:30,cruise:90,pref:"fast",gCap:30};
try{Object.assign(SET,JSON.parse(localStorage.getItem("ecoSettings")||"{}"));}catch(e){}
function saveSet(){try{localStorage.setItem("ecoSettings",JSON.stringify(SET));}catch(e){}}
let XLAT=35.3; // 平面に直す時の基準の緯度（ルートの平均）
function xy(lat,lon){const r=Math.PI/180;return[R*lon*r*Math.cos(XLAT*r),R*lat*r];}

/* ===================== ルート =====================
   ROUTE：経路の点、MANS：案内[緯度,経度,文,種類,点の番号]、ATTR：道路の区間{a,b(km),hw(高速),lim(制限速度),v(想定速度)}、SAS：沿線のSA・PA */
let STOP=null; // 立ち寄り先のSA・PA {name,lat,lon,km}
let ROUTE=[],MANS=[],ATTR=[],SAS=[],DEST=null,RT={time:0,len:0,toll:false};
let P=[],RCUM=[0],TOTAL=0,SAKM=[],GUIDE=[],GENK=1,TUN=[];
let MODE="browse"; // browse＝目的地を決める／preview＝経路を確認／nav＝案内中
const hasRoute=()=>ROUTE.length>1&&TOTAL>0;

function project(lat,lon,kmFrom,kmTo){
  const q=xy(lat,lon);let best={d:1e9,km:0};
  for(let i=0;i<P.length-1;i++){
    if(kmFrom!=null&&(RCUM[i+1]<kmFrom||RCUM[i]>kmTo))continue;
    const a=P[i],b=P[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-12;
    let t=((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(q[0]-(a[0]+t*dx),q[1]-(a[1]+t*dy));
    if(d<best.d)best={d,km:RCUM[i]+t*(RCUM[i+1]-RCUM[i])};
  }
  return best;
}
// 走行中の現在地：前回の位置の少し手前〜先だけで探す。アンダーパスで、この先に通る上の道と交差した時に
// 先の区間へ飛んで地図が回らないように。先は前回から時速150kmで進める距離まで。
// 近くに見つからない時（ルート外れ等）は全体から探す
let trackKm=null,trackT=0;
function projectTrack(lat,lon,t){
  const all=project(lat,lon);let r=all;
  if(trackKm!=null){
    const h=Math.max(0,(t-trackT)/3.6e6),near=project(lat,lon,trackKm-0.2,trackKm+0.2+h*150);
    if(near.d<0.25||near.d<=all.d+0.03)r=near;
  }
  trackKm=r.km;trackT=t;return r;
}
// 道路の区間（kmの順に並んでいる）から、その位置の高速/一般道・制限速度・想定速度を引く
const NOATTR={hw:false,lim:null,v:40};
function attrAt(km){
  let lo=0,hi=ATTR.length-1;if(hi<0)return NOATTR;
  while(lo<hi){const m=(lo+hi+1)>>1;if(ATTR[m].a<=km)lo=m;else hi=m-1;}
  return ATTR[lo];
}
// 高速道路に乗っているか：速さではなく場所で決める（渋滞中も高速、速い一般道は一般道）。
// ルートの高速部分の線上を、同じ向きで3回続けて走ったら高速、線から離れたのが3回続いたら一般道。
// 高速の下や上を横切る一般道は向きが違うので高速にならない
let HWL=[],hwOn=null,hwIn=0,hwOut=0,hwSaid=null;
function initHW(){HWL=[];for(let i=0;i<P.length-1;i++)if(attrAt((RCUM[i]+RCUM[i+1])/2).hw)HWL.push([P[i],P[i+1]]);}
function hwUpdate(lat,lon,hd){
  const q=xy(lat,lon);let bd=1e9,bh=0;
  for(const[a,b]of HWL){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-12;
    const t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2)),d=Math.hypot(q[0]-(a[0]+t*dx),q[1]-(a[1]+t*dy));
    if(d<bd){bd=d;bh=(Math.atan2(dx,dy)*180/Math.PI+360)%360;}}
  const diff=hd==null?0:Math.abs(((hd-bh)%360+540)%360-180);
  if(bd<(hwOn?0.08:0.05)&&diff<35){hwOut=0;if(++hwIn>=3)hwOn=true;}
  else{hwIn=0;if(++hwOut>=3)hwOn=false;}
}
function onHighway(){
  if(curPos&&hwOn!=null&&!timer)return hwOn;
  return hasRoute()&&attrAt(curKm).hw; // デモ走行・GPS前は道路の区間で決める
}
// 点の並びから距離を作る
function buildGeom(){
  if(ROUTE.length<2){P=[];RCUM=[0];TOTAL=0;return;}
  XLAT=ROUTE.reduce((a,p)=>a+p[0],0)/ROUTE.length;
  P=ROUTE.map(r=>xy(r[0],r[1]));trackKm=null;
  RCUM=[0];for(let i=1;i<P.length;i++)RCUM[i]=RCUM[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
  TOTAL=RCUM[RCUM.length-1];
}
// 案内・SA・高速の線・時間の補正を作り直す（ルートや道路の情報が変わるたびに呼ぶ）
function buildIndex(){
  GUIDE=MANS.map(m=>({name:"",text:m[2],ty:m[3],stop:m[5]==="stop",km:m[4]!=null&&RCUM[m[4]]!=null?RCUM[m[4]]:project(m[0],m[1]).km})).sort((a,b)=>a.km-b.km);
  SAKM=SAS.map(s=>{const q=project(s.lat,s.lon);return{name:s.name,lat:s.lat,lon:s.lon,km:q.km,d:q.d,f:""};}).filter(s=>s.d<0.5).sort((a,b)=>a.km-b.km);
  if(STOP){const g=GUIDE.find(x=>x.stop);STOP.km=g?g.km:null;}
  // トンネル（300m以上）ごとに、中にある案内（分岐・出口）を順番に。出てすぐ（300m以内）の案内も含める
  TUN=[];for(const a of ATTR){if(!a.tun)continue;const p=TUN[TUN.length-1];if(p&&a.a-p.b<0.05)p.b=a.b;else TUN.push({a:a.a,b:a.b});}
  TUN=TUN.filter(t=>t.b-t.a>=0.3);
  for(const t of TUN){t.g=GUIDE.filter(g=>g.km>=t.a-0.05&&g.km<=t.b+0.3);t.g.forEach((g,i)=>{g.tun=t;g.ord=i+1;});}
  mapJams();
  calcGenK();initHW();
  $("sim").max=TOTAL.toFixed(1);
}
/* ---- 時間の見積もり：高速は基準速度（制限速度まで）で、一般道は経路検索の所要時間に合うよう道路の想定速度を補正して使う ---- */
const cruiseOf=s=>Math.min(s.lim||80,ECO.B||SET.cruise);
function calcGenK(){
  let hw=0,gen=0;for(const s of ATTR){const L=s.b-s.a;if(s.hw)hw+=L/Math.max(20,Math.min(s.lim||80,s.v||80))*60;else gen+=L/Math.max(5,s.v)*60;}
  GENK=gen>0?Math.max(0.8,Math.min(3,(RT.time/60-hw)/gen)):1;
}
function segMin(s,a,b){const L=Math.max(0,Math.min(b,s.b)-Math.max(a,s.a));if(!L)return 0;return s.hw?L/(cruiseOf(s)*0.95)*60:L/Math.max(5,s.v/GENK)*60;}
function driveMin(from,to){
  if(!ATTR.length)return(to-from)/40*60;
  let m=0,lo=0,hi=ATTR.length-1;while(lo<hi){const k=(lo+hi+1)>>1;if(ATTR[k].a<=from)lo=k;else hi=k-1;}
  for(let i=lo;i<ATTR.length&&ATTR[i].a<to;i++)m+=segMin(ATTR[i],from,to);
  return m;
}

/* ---- 時計（デモでは早送り） ---- */
let simOffset=0;const nowMs=()=>Date.now()+simOffset;

/* ---- GPS履歴から実測ペースと渋滞を判定 ---- */
let hist=[]; // {t,km,spd,alt}
function addSample(km,spd,alt){
  const t=nowMs();hist.push({t,km,spd,alt:alt??null});
  while(hist.length&&t-hist[0].t>35*60e3)hist.shift();
}
function windowSpeed(min){
  const t=nowMs(),w=hist.filter(h=>t-h.t<=min*60e3);
  if(w.length<2)return null;
  const dt=(w[w.length-1].t-w[0].t)/3.6e6;if(dt<min/60*0.5)return null; // 窓の半分以上のデータが必要
  const dist=Math.max(0,w[w.length-1].km-w[0].km);
  const sp=w.map(h=>h.spd).filter(v=>v!=null);
  const gpsAvg=sp.length?sp.reduce((a,b)=>a+b,0)/sp.length:null;
  return{prog:dist/dt,gps:gpsAvg,dist};
}
// 走行中（10km/h超）の区間だけで、見積もりとの速さの比を出す（休憩は除外）
function paceFactor(){
  let act=0,plan=0;
  for(let i=1;i<hist.length;i++){
    const a=hist[i-1],b=hist[i];
    if((a.spd??0)>10&&(b.spd??0)>10&&b.km>a.km){act+=(b.t-a.t)/60e3;plan+=driveMin(a.km,b.km);}
  }
  if(act<10)return 1;
  return Math.max(0.6,Math.min(1.3,plan/act));
}
function traffic(hw){
  const w=windowSpeed(3);
  if(!w)return{state:"none"};
  const v=w.gps!=null?Math.min(w.gps,w.prog*1.2):w.prog;
  if(w.dist<0.3)return{state:"stop",v:0};
  if(!hw)return{state:"none",v};
  if(v<40)return{state:"jam",v};
  if(v<65)return{state:"slow",v};
  return{state:"flow",v};
}
// 直近1.5kmの高度を距離で回帰して勾配（%）を出す。GPS高度は±10m程度ぶれるので短い区間では判定しない
function measuredGrade(){
  const last=hist[hist.length-1];if(!last)return null;
  const w=hist.filter(h=>h.alt!=null&&h.km<=last.km&&last.km-h.km<=1.5);
  if(w.length<4||last.km-w[0].km<0.8)return null;
  const n=w.length,mx=w.reduce((a,h)=>a+h.km,0)/n,my=w.reduce((a,h)=>a+h.alt,0)/n;
  let sxy=0,sxx=0;for(const h of w){sxy+=(h.km-mx)*(h.alt-my);sxx+=(h.km-mx)**2;}
  return sxx>0?sxy/sxx/10:null; // m/km → %
}
let gradeState="flat",lastG=null; // lastG={g,km}
function slope(){
  let g=measuredGrade();const km=hist.length?hist[hist.length-1].km:0;
  if(g!=null)lastG={g,km};
  else if(lastG&&km>=lastG.km&&km-lastG.km<2)g=lastG.g; // 一時的に判定できない時は直前の値を2kmまで使う
  else{gradeState="flat";lastG=null;return null;}
  // 出入りの閾値をずらして、境目で指示がちらつかないようにする
  if(gradeState==="up"?g>1.5:g>2.5)gradeState="up";
  else if(gradeState==="down"?g<-1.5:g<-2.5)gradeState="down";
  else gradeState="flat";
  return{g,state:gradeState};
}

const pad=n=>String(n).padStart(2,"0");
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function targetDate(now){
  const v=$("target").value;if(!v)return null;
  const [h,mi]=v.split(":").map(Number);const t=new Date(now);t.setHours(h,mi,0,0);
  if(t-now<-3*3600e3)t.setDate(t.getDate()+1);
  return t;
}
function fmtMin(m){const s=m<0?"−":"+";m=Math.abs(Math.round(m));return m>=60?`${s}${Math.floor(m/60)}時間${pad(m%60)}分`:`${s}${m}分`;}
function fmtDur(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)}時間${pad(m%60)}分`:`${m}分`;}

// 残り時間（分）：渋滞中は今の速さが先の数kmも続くと見なし、残りは実測ペースで補正
function remainMin(km,to,tr,f){
  let lead=0,start=km;
  if((tr.state==="jam"||tr.state==="slow")&&tr.v>3){
    const L=Math.min(tr.state==="jam"?8:5,Math.max(0,to-km));
    lead=L/tr.v*60;start=km+L;
  }
  return lead+driveMin(start,to)/f;
}

/* ===================== 燃費最適化（高速だけ） =====================
   1) 坂の先読み：ルート全体の200mごとの標高をValhallaから取り、トンネル上の山・橋の下の谷を除いて道路の高さを推定。
      上り（2%前後以上・600m以上）はクルーズ−5、下りは+5（制限速度まで）。上りで落とした分を下りで取り戻すので、到着時刻はほぼ変わらない
   2) 減速ポイント：出口・分岐の手前で、アクセルを離せば目標の速さまで落ちる地点を出す（ブレーキで捨てる分を回生で回収）
   3) 燃費優先（設定でONにした時だけ）：確保したい休憩時間を残したうえで、目標到着に間に合う一番遅い（＝燃費の良い）クルーズ速度を選ぶ
   4) 燃費の計算式：車重・空気抵抗・転がり抵抗・坂から燃料を見積もる（GG3W、100km/h平坦で約12km/Lになるよう合わせてある） */
const CAR={m:2000,crr:0.010,cda:0.85,kwhPerL:1.97,aux:0.5,regen:0.55};
// 記録から学んだ補正：s＝効率（燃料1Lで走れる仕事の倍率）、k＝空気抵抗の倍率、dist＝学習に使った距離
let CAL={s:1,k:1,dist:0};try{Object.assign(CAL,JSON.parse(localStorage.getItem("carCal")||"{}"));}catch(e){}
function fuelPerKmK(vkmh,gPct,k){
  const v=vkmh/3.6,F=CAR.m*9.81*(CAR.crr+gPct/100)+0.6*CAR.cda*k*v*v; // N（0.6＝空気の密度/2）
  const wh=F/3.6,aux=CAR.aux*1000/Math.max(vkmh,5); // 1kmあたりWh
  return (wh>0?wh+aux:aux+wh*CAR.regen)/1000/CAR.kwhPerL; // 下りで余った分は回生で一部回収
}
const fuelPerKm=(v,g)=>fuelPerKmK(v,g,CAL.k)/CAL.s;
// 下りで回生が始まらない（重力と抵抗がつり合う）速さ。これより遅いと、クルーズが回生ブレーキで速度を抑える＝損
function vBalance(gPct){const f=CAR.m*9.81*(CAR.crr+gPct/100);return f<0?Math.sqrt(-f/(0.6*CAR.cda*CAL.k))*3.6:0;}
const ECO={step:0.2,z:null,g:null,segs:[],state:"none",key:"",B:null,stopMin:0,fuelT:0,fuel:null,timer:null};
try{const v=JSON.parse(localStorage.getItem("ecoStop")||"null");if(v&&v.d===new Date().toDateString())ECO.stopMin=v.m||0;}catch(e){}
function saveStop(){try{localStorage.setItem("ecoStop",JSON.stringify({d:new Date().toDateString(),m:ECO.stopMin}));}catch(e){}}
function routeKey(){return hasRoute()?ROUTE.length+":"+ROUTE[0].join(",")+":"+ROUTE[ROUTE.length-1].join(",")+":"+TOTAL.toFixed(2):"";}
function encPoly(pts){
  const enc=v=>{v=v<0?~(v<<1):v<<1;let s="";while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5;}return s+String.fromCharCode(v+63);};
  let o="",pl=0,pg=0;for(const p of pts){const la=Math.round(p[0]*1e6),lo=Math.round(p[1]*1e6);o+=enc(la-pl)+enc(lo-pg);pl=la;pg=lo;}return o;
}
// a〜b kmのルートの点（両端を含む）
function ptsBetween(a,b){const pts=[posAt(a)];for(let i=0;i<ROUTE.length;i++)if(RCUM[i]>a&&RCUM[i]<b)pts.push(ROUTE[i]);pts.push(posAt(b));return pts;}
// 地形の標高から道路の高さを推定（200mごと、2m刻み。1区間の勾配は±6%まで、勾配の急な変化に罰則、地形との差は12mで頭打ち＝トンネル・橋は外れ値扱い）
function roadProfile(h,stepM){
  const n=h.length,BIN=2,G=Math.round(0.06*stepM/BIN),T=12,LAM=1.5,MU=0.15;
  let lo=Infinity,hi=-Infinity;for(const v of h)if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  if(!isFinite(lo))return null;
  lo=Math.floor(lo-20);hi=Math.ceil(hi+20);
  const NB=Math.ceil((hi-lo)/BIN)+1,NG=2*G+1,S=NB*NG,INF=1e15;
  let D=new Float64Array(S),E=new Float64Array(S);
  const back=new Int8Array(n*S);
  const data=(i,b)=>{const v=h[i];return v==null?0:Math.min(Math.abs(lo+b*BIN-v),T);};
  for(let b=0;b<NB;b++)for(let g=-G;g<=G;g++)D[b*NG+g+G]=data(0,b)+MU*Math.abs(g);
  for(let i=1;i<n;i++){
    E.fill(INF);
    for(let b=0;b<NB;b++){const dc=data(i,b);
      for(let g=-G;g<=G;g++){const pb=b-g;if(pb<0||pb>=NB)continue;
        let best=INF,bg=0;const base=pb*NG;
        for(let gp=Math.max(-G,g-2);gp<=Math.min(G,g+2);gp++){const c=D[base+gp+G]+LAM*Math.abs(g-gp);if(c<best){best=c;bg=gp;}}
        const k=b*NG+g+G;E[k]=best+dc+MU*Math.abs(g);back[i*S+k]=bg;}}
    const t=D;D=E;E=t;
  }
  let bk=0,bc=INF;for(let k=0;k<S;k++)if(D[k]<bc){bc=D[k];bk=k;}
  const z=new Float32Array(n);let b=Math.floor(bk/NG),g=bk%NG-G;
  for(let i=n-1;i>=0;i--){z[i]=lo+b*BIN;if(i===0)break;const gp=back[i*S+b*NG+g+G];b=b-g;g=gp;}
  return z;
}
// 重い計算なので、画面が止まらないよう別スレッドで
function runProfile(h){return new Promise(res=>{
  try{const src=roadProfile.toString()+";onmessage=e=>{const z=roadProfile(e.data,200);postMessage(z?Array.from(z):null);};";
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
    w.onmessage=e=>{res(e.data?Float32Array.from(e.data):null);w.terminate();};
    w.onerror=()=>{w.terminate();res(roadProfile(h,200));};
    w.postMessage(h);
  }catch(e){setTimeout(()=>res(roadProfile(h,200)),0);}
});}
function scheduleElev(){clearTimeout(ECO.timer);ECO.timer=setTimeout(loadElevation,1500);}
async function loadElevation(){
  const key=routeKey();ECO.key=key;ECO.z=null;ECO.g=null;ECO.segs=[];
  if(!key||!ATTR.some(s=>s.hw)){ECO.state="none";return;} // 坂の先読みは高速でしか使わない
  try{const c=JSON.parse(localStorage.getItem("ecoElev")||"null");if(c&&c.key===key&&c.z){applyProfile(Float32Array.from(c.z));return;}}catch(e){}
  ECO.state="loading";
  try{
    // 40kmごとに分けて、200m間隔の標高をもらう（1回の問い合わせを小さくする）
    const CH=40,samples=[];
    for(let a=0;a<TOTAL-0.01;a+=CH){
      const b=Math.min(TOTAL,a+CH);
      const q={encoded_polyline:encPoly(ptsBetween(a,b)),resample_distance:200};
      const r=await fetch(VAL+"/height?json="+encodeURIComponent(JSON.stringify(q)));
      if(!r.ok)throw new Error("height "+r.status);
      const j=await r.json(),hs=j.height||[],n=hs.length;if(n<2)throw new Error("empty");
      for(let k=(a===0?0:1);k<n;k++)samples.push([a+(b-a)*k/(n-1),hs[k]]);
      if(key!==ECO.key)return; // 途中でルートが変わった
      await new Promise(r=>setTimeout(r,400)); // 無料サーバーに負担をかけない
    }
    // 200mごとの等間隔に並べ直す
    const n=Math.floor(TOTAL/ECO.step)+1,h=new Array(n);let j=0;
    for(let i=0;i<n;i++){const x=i*ECO.step;while(j<samples.length-2&&samples[j+1][0]<x)j++;
      const [x0,h0]=samples[j],[x1,h1]=samples[j+1]||samples[j];
      h[i]=h0==null||h1==null?(h0??h1):h0+(h1-h0)*Math.max(0,Math.min(1,(x-x0)/((x1-x0)||1)));}
    const z=await runProfile(h);if(!z)throw new Error("profile");
    if(key!==ECO.key)return;
    try{localStorage.setItem("ecoElev",JSON.stringify({key,z:Array.from(z,v=>Math.round(v))}));}catch(e){}
    applyProfile(z);
  }catch(e){if(key===ECO.key)ECO.state="fail";}
}
function applyProfile(z){
  const n=z.length,st=ECO.step,g=new Float32Array(n);
  for(let i=0;i<n-1;i++)g[i]=(z[i+1]-z[i])/(st*10); // %
  g[n-1]=g[n-2]||0;
  const sm=new Float32Array(n);for(let i=0;i<n;i++){let s=0,c=0;for(let k=-2;k<=2;k++){const v=g[i+k];if(v!=null&&i+k>=0&&i+k<n){s+=v;c++;}}sm[i]=s/c;}
  // 上り・下りが600m以上続く所を坂として切り出す
  const cls=Array.from(sm,v=>v>=1.8?1:v<=-1.8?-1:0),segs=[];
  for(let i=0;i<n;){let k=i;while(k+1<n&&cls[k+1]===cls[i])k++;
    if(cls[i]!==0&&(k-i+1)*st>=0.6){const a=i*st,b=Math.min(TOTAL,(k+1)*st),gv=(z[Math.min(n-1,k+1)]-z[i])/((b-a)*10);
      if(Math.abs(gv)>=1.8)segs.push({a,b,type:gv>0?"up":"down",g:gv});}
    i=k+1;}
  ECO.z=z;ECO.g=sm;ECO.segs=segs;ECO.state="ok";ECO.fuelT=0;
}
const gradeAt=km=>{if(!ECO.g)return 0;const i=Math.max(0,Math.min(ECO.g.length-1,Math.floor(km/ECO.step)));return ECO.g[i];};
const segAt=km=>ECO.segs.find(s=>s.a<=km&&km<s.b)||null;
const nextSeg=(km,within)=>ECO.segs.find(s=>s.a>km&&s.a-km<=within)||null;
function profSl(km){const s=segAt(km);return s?{g:s.g,state:s.type}:{g:gradeAt(km),state:"flat"};}
// 高速の指定速度：基準速度（燃費優先ONならその速度）を制限速度までにし、坂で上下させる。ランプ等の40以下はクルーズを使わない
function plannedSet(km){
  const at=attrAt(km),lim=at.lim||80;
  let v=Math.min(lim,ECO.B||SET.cruise);
  const s=segAt(km);
  if(s&&s.type==="up")v=Math.max(Math.min(v,80),v-5);
  else if(s){const vb=Math.ceil(vBalance(s.g)/5)*5;v=Math.min(lim,Math.max(v,vb));} // 下り：つり合う速さまで（それ以上は上げても得しない）
  return v;
}
// 燃費の計算に使う速さ：高速は指定速度、一般道は35km/h
const planV=km=>attrAt(km).hw?plannedSet(km):35;
function ecoAdvice(km,set){
  const B=Math.min(attrAt(km).lim||80,ECO.B||SET.cruise),cur=segAt(km),nx=nextSeg(km,1.5);
  if(cur&&cur.type==="up")return`上り ${cur.g.toFixed(1)}%・あと${(cur.b-km).toFixed(1)}km → ${set}`;
  if(cur)return`下り ${(-cur.g).toFixed(1)}%・あと${(cur.b-km).toFixed(1)}km`+(set!==B?` → ${set}`:" → そのまま");
  if(nx)return`${(nx.a-km).toFixed(1)}km先 ${nx.type==="up"?"上り":"下り"} ${Math.abs(nx.g).toFixed(1)}%（${(nx.b-nx.a).toFixed(1)}km）`;
  if(ECO.B&&ECO.B<SET.cruise)return`燃費優先 → ${B}`;
  return"";
}
// 燃費優先：確保したい休憩の残りを差し引いても目標に間に合う、一番遅いクルーズ速度
function chooseB(km,tr,f,now){
  const tgt=targetDate(now);if(!tgt){ECO.B=null;return;}
  const avail=(tgt-now)/60e3-Math.max(0,(+SET.restMin||0)-ECO.stopMin);
  let pick=Math.max(SET.cruise,100);
  for(const c of[80,85,90,95,100]){ECO.B=c;if(remainMin(km,TOTAL,tr,f)<=avail){pick=c;break;}}
  ECO.B=pick;
}
// この先の予想燃費（30秒ごとに計算し直す）
function tripFuel(km){
  if(ECO.state!=="ok")return null;
  const t=performance.now();if(ECO.fuel&&t-ECO.fuelT<30000&&Math.abs(ECO.fuel.km-km)<2)return ECO.fuel;
  let L=0,d=0;
  for(let x=km;x<TOTAL;x+=ECO.step){L+=fuelPerKm(planV(x),gradeAt(x))*ECO.step;d+=ECO.step;}
  ECO.fuel={km,L,kmL:d/Math.max(L,1e-6)};ECO.fuelT=t;return ECO.fuel;
}
// 減速ポイント：アクセルを離した時の減速（空気抵抗＋回生、約0.45m/s²）で、出口・分岐で目標の速さになる所から知らせる
const DEC={said:new Set()};
function decelFor(km,v){
  if(v==null||isNaN(v))return null;
  const nj=GUIDE.find(j=>j.km>km+0.005);if(!nj)return null;
  const d=(nj.km-km)*1000;if(d>2500)return null;
  if(![9,16,18,19,20,21,23,24].includes(nj.ty))return null;
  // その先も高速なら分岐（JCT）、一般道になるなら出口
  const branch=attrAt(Math.min(TOTAL,nj.km+1.5)).hw,vt=branch?80:70,what=branch?"分岐":"出口";
  if(v<vt+8)return null;
  const ms=v/3.6,mt=vt/3.6,lift=(ms*ms-mt*mt)/(2*0.45);
  if(d>lift+40)return null;
  const key=nj.km.toFixed(3);
  if(!DEC.said.has(key)){DEC.said.add(key);if(SET.voiceEco)speak("アクセルを離してください");}
  return{vt,msg:`${what}まで${Math.round(d/10)*10}m アクセルOFF`};
}

/* ---- 燃費の記録（任意）：停車して1分たったら入力カードを出す。走り出したら消える。入れなくてもよい ----
   車の「平均燃費」（出発時にリセットした値）を入れると、計算式の予想と比べて補正し、この先の予想燃費に反映する */
const FUEL={log:[],startKm:0,cal:1,stopT:0,lastAskKm:-99,needStart:false,sv:{},sc:{}};
try{const v=JSON.parse(localStorage.getItem("ecoFuel")||"null");if(v&&Date.now()-(v.t||0)<12*3600e3)Object.assign(FUEL,{log:v.log||[],startKm:v.startKm||0,sv:v.sv||{},sc:v.sc||{},prior:v.prior||null});}catch(e){}
function fuelStore(){try{localStorage.setItem("ecoFuel",JSON.stringify({t:Date.now(),log:FUEL.log,startKm:FUEL.startKm,sv:FUEL.sv,sc:FUEL.sc,prior:FUEL.prior}));}catch(e){}}
function recordSpeed(km,spd){if(spd==null||spd<10)return;const i=Math.floor(km/ECO.step);FUEL.sv[i]=(FUEL.sv[i]||0)+spd;FUEL.sc[i]=(FUEL.sc[i]||0)+1;}
const actualV=i=>FUEL.sc[i]?FUEL.sv[i]/FUEL.sc[i]:null;
// a→b km を実際に走った速さ（記録がない所は計画の速さ）で走った時の燃料（L、補正なし）
function rawLiters(a,b,k){let L=0;for(let x=a;x<b;x+=ECO.step){const i=Math.floor(x/ECO.step);let v=actualV(i);if(v==null)v=planV(x);L+=fuelPerKmK(v,gradeAt(x),k)*Math.min(ECO.step,b-x);}return L;}
/* 記録から計算式を補正する。車の平均燃費は出発からの合計なので、記録と記録の間ごとに「実際に使った燃料」を出し、
   計算式の予想と比べて、効率 s と空気抵抗の倍率 k を合わせる（区間が2つ以上ある時だけ k も動かす）。前の旅までの学習と距離で重み付けして混ぜる */
function updateCal(){
  const pts=[{km:FUEL.startKm,L:0}];
  for(const r of FUEL.log)if(r.km-FUEL.startKm>=5)pts.push({km:r.km,L:(r.km-FUEL.startKm)/r.kmL});
  const segs=[];for(let j=1;j<pts.length;j++){const d=pts[j].km-pts[j-1].km,A=pts[j].L-pts[j-1].L;if(d>=20&&A>0)segs.push({a:pts[j-1].km,b:pts[j].km,A,d});}
  const P0=FUEL.prior||(FUEL.prior={s:CAL.s,k:CAL.k,dist:CAL.dist||0});
  if(!segs.length){FUEL.cal=CAL.s;return;}
  const ks=segs.length>=2?[0.7,0.8,0.9,1,1.1,1.2,1.3,1.4]:[P0.k];
  let best=null;
  for(const k of ks){const Pk=segs.map(g=>rawLiters(g.a,g.b,k));
    let pp=0,pa=0;segs.forEach((g,j)=>{pp+=Pk[j]*Pk[j];pa+=Pk[j]*g.A;});const sFit=pp/pa; // A ≈ P/s
    const err=segs.reduce((e,g,j)=>e+(g.A-Pk[j]/sFit)**2,0);if(!best||err<best.err)best={k,s:sFit,err};}
  const dNew=segs.reduce((a,g)=>a+g.d,0),w=Math.min(P0.dist,600);
  const s=Math.max(0.6,Math.min(1.6,(P0.s*w+best.s*dNew)/(w+dNew))),k=Math.max(0.7,Math.min(1.4,(P0.k*w+best.k*dNew)/(w+dNew)));
  FUEL.trip={s,k,dNew};FUEL.cal=s;ECO.fuelT=0;
  CAL.s=s;CAL.k=k; // 今の旅の値（旅の終わりに学習済みとして距離を足す）
  try{localStorage.setItem("carCal",JSON.stringify({s,k,dist:P0.dist}));}catch(e){}fuelStore();
}
function fuelAskCheck(spd){
  const box=$("fuelAsk"),t=performance.now();
  if(spd!=null&&spd<3){
    if(!FUEL.stopT)FUEL.stopT=t;
    if(t-FUEL.stopT>60000&&box.hidden&&Math.abs(curKm-FUEL.lastAskKm)>5){
      FUEL.lastAskKm=curKm;$("fuelIn").value="";$("fuelMsg").textContent="入れなくてもかまいません";box.hidden=false;}
  }else if(spd!=null&&spd>10){FUEL.stopT=0;if(!box.hidden&&document.activeElement!==$("fuelIn"))box.hidden=true;} // 走り出したら消す
}
$("fuelSave").addEventListener("click",()=>{
  const v=parseFloat(($("fuelIn").value||"").replace(/[,，．]/g,"."));
  if(!(v>=3&&v<=99)){$("fuelMsg").textContent="3〜99の数字で入れてください";return;}
  FUEL.log.push({t:Date.now(),km:curKm,kmL:v});fuelStore();
  const raw=rawLiters(FUEL.startKm,curKm,1),p=raw>0?(curKm-FUEL.startKm)/raw:null,diff=p?Math.round((v/p-1)*100):null;
  $("fuelMsg").textContent="記録しました"+(diff!=null&&curKm-FUEL.startKm>=20?`（はじめの計算式より${diff>=0?"+":""}${diff}%・次から反映）`:"");
  updateCal();$("fuelIn").blur();setTimeout(()=>{$("fuelAsk").hidden=true;},2500);render(curKm);
});
$("fuelClose").addEventListener("click",()=>{$("fuelIn").blur();$("fuelAsk").hidden=true;});
$("fuelIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("fuelSave").click();});
function trackStop(spd){
  const t=performance.now();
  if(ECO.lastFixT){const dt=(t-ECO.lastFixT)/60e3;if(dt<1&&spd!=null&&spd<3){ECO.stopMin+=dt;if(Math.random()<0.1)saveStop();}}
  ECO.lastFixT=t;
}

let curKm=0,gpsSpeed=null,hurry=false;
function render(km){
  const now=new Date(nowMs());
  $("clock").textContent=hm(now);
  if(!hasRoute()){syncNav();return;}
  km=curKm=Math.max(0,Math.min(TOTAL,km));
  const at=attrAt(km),hw=onHighway();
  const tr=traffic(hw),f=paceFactor();
  if(SET.ecoRest&&hw)chooseB(km,tr,f,now);else if(!SET.ecoRest)ECO.B=null;
  const sl=ECO.state==="ok"?profSl(km):slope();
  // 指定速度は高速だけ。渋滞は40（クルーズOFF）、流れ遅めは80（前車に追従）、ランプ等の40以下はクルーズOFF（首都高の60はクルーズ）
  let set=null,cc="",adv="";
  const lim=at.lim||80;
  if(hw){
    if(tr.state==="jam"){set=Math.min(40,lim);cc="off";}
    else if(tr.state==="slow"){set=Math.min(80,lim);cc="acc";}
    else if(at.hw&&lim<=40){set=lim;cc="off";}
    else{
      set=plannedSet(km);cc="cruise";
      if(ECO.state==="ok")adv=ecoAdvice(km,set);
      else if(sl&&sl.state!=="flat")adv=`${sl.state==="up"?"上り坂":"下り坂"} ${Math.abs(sl.g).toFixed(1)}%`;
    }
  }
  // 目標に遅れそうなときだけクルーズ設定を上げる（遅れ5分まで+5、それ以上+10、制限速度まで）。余裕が5分戻るまで続ける
  const rem=remainMin(km,TOTAL,tr,f)+jamDelayAhead(km,tr.state==="jam"||tr.state==="slow"),eta=new Date(now.getTime()+rem*60e3);
  const tgt=targetDate(now),slack=tgt?(tgt-eta)/60e3:null;
  if(slack==null||slack>5)hurry=false;else if(slack<0)hurry=true;
  if(hw&&cc==="cruise"&&hurry&&tr.state==="flow"){
    const up=Math.min(lim,set+(slack!=null&&slack<-5?10:5));
    if(up>set){set=up;adv=(adv?adv+"　":"")+`遅れ気味 → クルーズ${up}`;}
  }
  // 設定より速いときだけ知らせる（遅いときに設定を下げる助言はしない：休憩時間が減るため）
  const w1=windowSpeed(1);
  if(hw&&w1&&set!=null&&tr.state==="flow"){
    const v=w1.gps??w1.prog,d=Math.round(v-set);
    if(d>7)adv=(adv?adv+"　":"")+`設定より+${d}km/h`;
  }
  if(hw&&cc==="cruise"){const dc=decelFor(km,gpsSpeed!=null?gpsSpeed:set);if(dc){set=dc.vt;cc="lift";adv=dc.msg;}}
  $("advice").hidden=!adv;$("advice").textContent=adv;
  $("grade").textContent=sl?`勾配 ${sl.g>=0?"+":"−"}${Math.abs(sl.g).toFixed(1)}%`:"";
  const tb=$("trafficBox");
  if(tr.state==="jam"){tb.hidden=false;tb.textContent=`渋滞 ${tr.v.toFixed(0)} km/h`;}
  else if(tr.state==="slow"){tb.hidden=false;tb.textContent=`流れ遅め ${tr.v.toFixed(0)} km/h`;}
  else if(tr.state==="stop"&&hw){tb.hidden=false;tb.textContent="停車中";}
  else tb.hidden=true;

function posAt(km){
  if(!ROUTE.length)return curPos||[35.68,139.6];
  let lo=0,hi=RCUM.length-1;if(km<=0)return ROUTE[0];if(km>=RCUM[hi])return ROUTE[hi];
  while(hi-lo>1){const m=(lo+hi)>>1;if(RCUM[m]<km)lo=m;else hi=m;}
  const t=(km-RCUM[lo])/(RCUM[hi]-RCUM[lo]||1);
  return[ROUTE[lo][0]+(ROUTE[hi][0]-ROUTE[lo][0])*t,ROUTE[lo][1]+(ROUTE[hi][1]-ROUTE[lo][1])*t];
}

const TILE_URL=(z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/pale/${z}/${x}/${y}.png`;
let dbP=null;
function tileDb(){
  if(!dbP)dbP=new Promise(res=>{
    try{const r=indexedDB.open("ecoTilesPale",1);r.onupgradeneeded=()=>r.result.createObjectStore("t");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}

async function loadTile(z,x,y){

}

// ルート沿いの地図：ズーム9〜13は全体（12までは線の両側1枚分）、14〜16は一般道の所だけ
function routeTiles(){
  const set=new Set();
  for(let z=9;z<=16;z++){const n=2**z;
    for(let km=0;km<=TOTAL;km+=z<=13?1:0.2){
      if(z>13&&attrAt(km).hw)continue;
      const [la,lo]=posAt(km),r=la*Math.PI/180;
      const x=Math.floor((lo+180)/360*n),y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);
      const r1=z<=12?1:0;for(let dx=-r1;dx<=r1;dx++)for(let dy=-r1;dy<=r1;dy++)set.add(`${z}/${x+dx}/${y+dy}`);}
  }

/* ---- 道路の種類（高速か）・制限速度：経路の線をValhallaに渡して道路ごとに教えてもらう（60kmごと） ---- */
async function loadAttr(){

    const out=[];
    for(let a=0;a<TOTAL-0.01;a+=60){
      const b=Math.min(TOTAL,a+60);
      const q={encoded_polyline:encPoly(ptsBetween(a,b)),shape_match:"edge_walk",costing:"auto",
        filters:{attributes:["edge.road_class","edge.use","edge.speed_limit","edge.speed","edge.length","edge.tunnel"],action:"include"}};
      const r=await fetch(VAL+"/trace_attributes?json="+encodeURIComponent(JSON.stringify(q)));
      if(!r.ok)throw new Error(r.status);

      let x=a;for(const e of es){const L=(e.length||0)/tot*(b-a),lim=+e.speed_limit;

// 2026-10の試験では overpass-api.de は504が多く、mail.ru は約60秒で返ったので mail.ru を先に
const OVERPASS=["https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
async function loadSA(retry){

  const pts=[];for(let k=0;k<=TOTAL;k+=1)if(attrAt(k).hw)pts.push(posAt(k));
  if(pts.length<5)return;
  const q=`[out:json][timeout:60];nwr["highway"~"^(services|rest_area)$"](around:350,${pts.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(",")});out center tags;`;
  for(const u of OVERPASS){
    try{
      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),100000);
      const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q),signal:ctl.signal});
      clearTimeout(tm);if(!r.ok)continue;
      const els=(await r.json()).elements||[];if(key!==routeKey())return;
      // 本線からの横のずれ（km、左が＋）を出し、上り・下りの組は左にある方だけ残す
      const cand=[];
      for(const e of els){
        const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);if(lat==null)continue;
        const pr=project(lat,lon);if(pr.d>0.4||!attrAt(pr.km).hw)continue;
        const a=xy(...posAt(Math.max(0,pr.km-0.05))),b=xy(...posAt(pr.km+0.05)),c=xy(lat,lon),L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;

        const name=(e.tags&&e.tags.name)||(e.tags&&e.tags.highway==="services"?"SA":"PA");

      }
      // 上り・下りの組ごとに「左にある方」の向きを数え、多い方をこの旅の向きとする（地図データの位置がずれている所があるため）
      const dirOf=n=>(n.match(/[（(](上り|下り|内回り|外回り)[)）]/)||[])[1]||"";
      const vote={};
      for(const x of cand){const grp=cand.filter(y=>y.base===x.base&&Math.abs(y.km-x.km)<3);
        if(grp.length<2||grp[0]!==x)continue;const b=grp.reduce((p,y)=>y.side>p.side?y:p),d=dirOf(b.name);if(d)vote[d]=(vote[d]||0)+1;}
      const myDir=Object.keys(vote).sort((a,b)=>vote[b]-vote[a])[0]||"";
      const got=[];
      for(const x of cand){
        const grp=cand.filter(y=>y.base===x.base&&Math.abs(y.km-x.km)<3);
        const mine=myDir&&grp.filter(y=>dirOf(y.name)===myDir);
        const best=mine&&mine.length?mine.reduce((p,y)=>y.side>p.side?y:p):grp.reduce((p,y)=>y.side>p.side?y:p);
        const dx=dirOf(x.name);

        if(got.some(g=>g.base===x.base&&Math.abs(g.km-x.km)<3))continue;

      SAS=got.map(({name,lat,lon})=>({name,lat,lon}));buildIndex();drawMarks();saveRoute();render(curKm);return;
    }catch(e){}
  }

}

}
function onGpsErr(e){
  if(e&&e.code===1){gpsWatch!=null&&navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;setStatus("bad","位置情報が許可されていません");
    const off=$("offroute");off.hidden=false;off.textContent="位置情報が許可されていません。iPhoneの「設定 → プライバシー → 位置情報サービス → Safari」で許可してください。";}
}
/* ---- GPSが途切れた時（トンネル等）：ルートの上を最後の速さで進めた「推定位置」で案内を続ける（最大10分）。
   GPSが戻ったら本当の位置に合わせる ---- */
const DR={goodT:0,ext:0,t:0,stopped:false};
function drOn(){const t=performance.now()-A.fixT;return MODE==="nav"&&!!curPos&&!timer&&onRouteF&&(A.spd>=10||MOT.ok)&&t>3000&&t<600000;}
// 最後のGPSから進んだ距離（km）。GPSが途切れている間は、止まっている時は進めず、走っている時は最後の速さで進める
// （渋滞で一度止まった後は、速さが分からないので25km/hで）
function drAhead(now){
  const sec=(now-A.fixT)/1000;
  if(sec<=2.5||!drOn()){DR.ext=Math.min(sec,2.5)*A.spd/3600;DR.t=now;DR.stopped=false;return DR.ext;}
  const dt=Math.max(0,Math.min(1,(now-DR.t)/1000));DR.t=now;
  if(MOT.still)DR.stopped=true;
  const v=MOT.still?0:DR.stopped||A.spd<10?Math.min(Math.max(A.spd,10),25):A.spd;
  DR.ext+=dt*v/3600;return DR.ext;
}
/* ---- 加速度センサー：揺れの大きさ（2秒間のばらつき）で停車を見分ける。しきい値はGPSで止まっている時・走っている時の揺れから学ぶ ---- */
const MOT={ok:false,on:false,buf:[],sd:null,still:false,stillT:0,moveT:0,thr:0.05,sS:[],sM:[]};
function initMotion(){
  if(MOT.on)return;
  const h=e=>{const a=e.accelerationIncludingGravity||e.acceleration;if(!a||a.x==null)return;
    const t=performance.now(),m=Math.hypot(a.x,a.y,a.z);MOT.buf.push([t,m]);while(MOT.buf.length&&t-MOT.buf[0][0]>2000)MOT.buf.shift();
    if(MOT.buf.length<20)return;MOT.ok=true;
    const n=MOT.buf.length,mean=MOT.buf.reduce((s,b)=>s+b[1],0)/n;MOT.sd=Math.sqrt(MOT.buf.reduce((s,b)=>s+(b[1]-mean)**2,0)/n);
    // 1.5秒続いたら切り替える（境目で行ったり来たりしないよう、走り出しはしきい値の1.5倍）
    if(MOT.sd<MOT.thr){MOT.moveT=0;if(!MOT.stillT)MOT.stillT=t;if(t-MOT.stillT>1500)MOT.still=true;}
    else if(MOT.sd>MOT.thr*1.5){MOT.stillT=0;if(!MOT.moveT)MOT.moveT=t;if(t-MOT.moveT>1500)MOT.still=false;}};
  const go=()=>{addEventListener("devicemotion",h);MOT.on=true;};
  try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function")DeviceMotionEvent.requestPermission().catch(()=>{});}catch(e){}
  go(); // 許可されなければイベントが来ないだけ
}
// GPSが正しい時に、止まっている時・走っている時の揺れを集めて、しきい値をその車・置き方に合わせる
function learnMotion(spd,acc){
  if(MOT.sd==null||spd==null||acc>30)return;
  const L=spd<1?MOT.sS:spd>30?MOT.sM:null;if(!L)return;
  L.push(MOT.sd);if(L.length>300)L.shift();
  if(MOT.sS.length>=20&&MOT.sM.length>=20){const med=a=>[...a].sort((x,y)=>x-y)[a.length>>1];
    MOT.thr=Math.max(0.01,Math.min(0.5,Math.sqrt(med(MOT.sS)*med(MOT.sM))));}
}
setInterval(()=>{if(drOn())render(Math.min(TOTAL,A.fixKm+drAhead(performance.now())));},1000); // 推定位置で案内の距離・音声を進める
function onFix(p){
  stopPlay();
  const c=p.coords;let s=c.speed!=null&&c.speed>=0?c.speed*3.6:null;
  lastFixT=Date.now();
  // トンネルの中などで来る誤差の大きい位置（基地局等、100m超）は、5分以内に良い位置があれば使わない（位置が飛んで「ルート外れ」になるため）
  if(MODE==="nav"&&hasRoute()&&c.accuracy>100&&DR.goodT&&Date.now()-DR.goodT<300000){setStatus("bad",`GPSが弱い（精度±${Math.round(c.accuracy)}m）`);return;}
  if(c.accuracy<=100)DR.goodT=Date.now();
  learnMotion(s,c.accuracy);
  if(c.heading!=null&&!isNaN(c.heading)&&(s??0)>5)gpsHeading=c.heading;
  setStatus("ok",`GPS受信中（精度±${Math.round(c.accuracy)}m）`);
  if(MODE!=="nav"||!hasRoute()){
    curPos=[c.latitude,c.longitude];gpsSpeed=s;feedFix(null,curPos,s);
    if(firstFix&&MODE==="browse")centerOn(curPos,15);
    firstFix=false;return;
  }
  firstFix=false;
  const pr=projectTrack(c.latitude,c.longitude,p.timestamp);
  if(s==null&&lastFix){const dt=(p.timestamp-lastFix.t)/3.6e6;if(dt>0)s=Math.max(0,(pr.km-lastFix.km)/dt);} // 速度が取れない時は進み具合から推定
  lastFix={t:p.timestamp,km:pr.km};offD=pr.d;
  const alt=c.altitude!=null&&(c.altitudeAccuracy==null||c.altitudeAccuracy<=20)?c.altitude:null;
  hwUpdate(c.latitude,c.longitude,(s??0)>8?(c.heading!=null&&!isNaN(c.heading)?c.heading:A.moveHd):null);
  curPos=[c.latitude,c.longitude];feedFix(pr.km,curPos,s);checkArea(curPos);trackStop(s);
  if(FUEL.needStart){FUEL.needStart=false;FUEL.startKm=pr.km;fuelStore();}
  if(offD<0.25)recordSpeed(pr.km,s);
  fuelAskCheck(s);
  gpsSpeed=s;addSample(pr.km,s,alt);
  const off=$("offroute");
  if(pr.d>0.25){off.hidden=false;off.textContent=rerouting?"ルートを再検索中…":rerouteMsg||"ルートから外れています";}else{off.hidden=true;rerouteMsg="";}
  $("sim").value=pr.km;$("simKm").textContent=pr.km.toFixed(0)+" km";
  checkArrive(pr.km);passStop(pr.km);
  render(pr.km);
}

/* ---- デモ：選んだルートを早送りで走る（1ステップ＝20秒ぶん） ---- */
$("sim").addEventListener("input",e=>{if(!hasRoute())return;const km=+e.target.value;$("simKm").textContent=km.toFixed(0)+" km";hist=[];gpsSpeed=null;curPos=null;demoKm=null;feedFix(km,null,0);render(km);});
let demoAlt=100,demoKm=null; // スライダーは0.5km刻みで丸まるので、デモの位置は別に持つ
let timer=null;
function stopPlay(){if(timer){clearInterval(timer);timer=null;$("playBtn").textContent="デモ走行を再生";}}
$("playBtn").addEventListener("click",()=>{
  if(timer){stopPlay();return;}
  if(!hasRoute()){$("playBtn").textContent="先に目的地を決めてください";return;}
  if(MODE!=="nav"){MODE="nav";applyMapMode();}
  document.body.classList.remove("sheet");
  $("playBtn").textContent="停止";setStatus("demo","デモ走行中（早送り）");
  timer=setInterval(()=>{
    const jam=$("jamSim").checked,pos=demoKm??+$("sim").value,at=attrAt(pos);
    const v=jam?12+Math.random()*16:at.hw?plannedSet(pos)-3+Math.random()*6:Math.max(15,at.v/GENK);
    let km=pos;
    for(let j=0;j<4;j++){ // 20秒ぶんを5秒ごとの4サンプルで記録
      simOffset+=5000;const dk=v*5/3600;km=Math.min(TOTAL,km+dk);
      demoAlt=ECO.z?ECO.z[Math.min(ECO.z.length-1,Math.floor(km/ECO.step))]:demoAlt;addSample(km,v,demoAlt+(Math.random()-0.5)*6);
    }
    if(km>=TOTAL)stopPlay();
    feedFix(km,null,(km-pos)/0.25*3600);curPos=null;demoKm=km;
    $("sim").value=km;$("simKm").textContent=km.toFixed(1)+" km";
    gpsSpeed=v;passStop(km);render(km);
  },250);
});
setInterval(()=>render(curKm),20000);
updateCal();
$("zoomReset").addEventListener("click",()=>{userZoom=null;try{localStorage.removeItem("mapZoom");}catch(e){}$("zoomReset").textContent="自動に戻しました（一般道16・高速13）";});
{const r=$("setRestMin");r.value=SET.restMin;r.addEventListener("change",()=>{SET.restMin=Math.max(0,+r.value||0);saveSet();render(curKm);});}
{const r=$("setGCap");r.value=SET.gCap;r.addEventListener("change",()=>{SET.gCap=Math.max(0,Math.min(200,Math.round(+r.value||0)));r.value=SET.gCap;saveSet();showUsage();});}
{const r=$("setCruise");r.value=SET.cruise;r.addEventListener("change",()=>{SET.cruise=Math.max(60,Math.min(120,+r.value||90));r.value=SET.cruise;saveSet();if(MODE==="preview")showPreview();render(curKm);});}
$("compassBtn").addEventListener("click",()=>initCompass()); // iPhoneはボタンを押した中でしか許可を聞けない
{const r=$("setMeY");r.value=SET.meY||0;r.addEventListener("input",()=>{SET.meY=+r.value;saveSet();lay.t=0;});}
$("inset").addEventListener("click",()=>{insetClosed=insetFor;$("inset").hidden=true;}); // タップで閉じる（次の案内では また出る）
restoreRoute();
applyMapMode();syncMap();startGps();
if(MODE==="preview"&&DEST){showPreview();setTimeout(()=>slideTo([DEST.lat,DEST.lon],16),500);}
if(MODE==="nav")render(0);
if(hasRoute()&&!ATTR.some(s=>s.lim))loadAttr().then(()=>{if(!SAS.length)loadSA();});
</script>
