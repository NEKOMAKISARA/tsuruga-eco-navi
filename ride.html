<style>

<script type="module">
import { build3D, makeProj, courseXZ, loadDem, segDist, DN, PC, THREE } from "./map3d.js";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const hms = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
const clock = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const clockS = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const km = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "km" : Math.round(v) + "m";
const kmh = v => Math.round(v * 3.6) + "km/h";
const hdist = (a, b) => { const k = Math.cos(a[0] * Math.PI / 180); return Math.hypot((b[0] - a[0]) * 110540, (b[1] - a[1]) * 111320 * k); };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "今" : m < 60 ? m + "分前" : Math.round(m / 60) + "時間前"; };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const norm = t => String(t).normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[\s・･.,、。'’\-‐]/g, "");
let toastT = 0; const toast = (m, ms = 3500) => { $("toast").textContent = m; $("toast").hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $("toast").hidden = true, ms); };

/* ---- 保存（端末の IndexedDB。使えない時はこの画面の間だけ） ---- */
let memDB = null;
const DB = new Promise(ok => { try { const q = indexedDB.open("rideLog", 1); q.onupgradeneeded = () => q.result.createObjectStore("logs", { keyPath: "id" }); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); } catch (e) { ok(null); } });
async function st(mode, fn) { const db = await DB; if (!db) { memDB = memDB || new Map(); return fn(null); }
  return new Promise((ok, ng) => { const t = db.transaction("logs", mode), r = fn(t.objectStore("logs")); t.oncomplete = () => ok(r && r.result); t.onerror = () => ng(t.error); }); }
const dbAll = () => st("readonly", s => s ? s.getAll() : { result: [...memDB.values()] });
const dbPut = o => st("readwrite", s => s ? s.put(o) : (memDB.set(o.id, o), null));
const dbDel = id => st("readwrite", s => s ? s.delete(id) : (memDB.delete(id), null));

/* ---- スキー場（カワサキサーチと同じ ski.json） ---- */
let ROWS = null;
const rows = async () => ROWS || (ROWS = (await (await fetch("ski.json")).json()).s.map(r => ({ nm: r[0], c: [r[1] / 1e5, r[2] / 1e5], cid: r[1] + "_" + r[2], yk: norm(r[6] || ""), key: norm(r[0]), elev: r[5] ? { top: [r[5][0] / 1e5, r[5][1] / 1e5, r[5][2]], base: [r[5][3] / 1e5, r[5][4] / 1e5, r[5][5]] } : null })));
const CD = {};
const course = async r => { if (!(r.cid in CD)) { try { const x = await fetch("ski_course/" + r.cid + ".json"); CD[r.cid] = x.ok ? await x.json() : null; } catch (e) { CD[r.cid] = null; } } return CD[r.cid]; };
// どのスキー場か：近く(12km)のスキー場のコース・リフトから 100m 以内にある点が一番多い所
async function findResort(pts) {
  const s = pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 300)) === 0), R = await rows();
  const near = R.filter(r => s.some(p => hdist(r.c, [p[1], p[2]]) < 12000));
  let best = null, bs = 0;
  for (const r of near) { const d = await course(r); if (!d) continue; const proj = makeProj(r.c), { P, Lf } = courseXZ(d, proj), segs = [];
    for (const o of [...P, ...Lf]) for (let j = 1; j < o.q.length; j++) segs.push([o.q[j - 1], o.q[j]]);
    let n = 0; for (const p of s) { const q = proj.fromLL(p[1], p[2]); if (Math.hypot(q[0], q[1]) > 15000) continue; for (const [a, b] of segs) if (segDist(q, a, b) < 100) { n++; break; } }
    if (n > bs) { bs = n; best = r; } }
  return best;
}

/* ---- 分析：標高（国土地理院）で上り下りを見て、リフトと滑走に分ける ----
   log.pts: [[時刻ms, 緯度, 経度, 精度m], …]、log.falls: [[時刻ms, 緯度, 経度, 強さG], …]
   opt: r（スキー場）, d（コース）, dem（緯度,経度→標高）, noCourse（通ったコースを調べない＝チェックイン中の軽い集計） */
async function analyze(log, opt = {}) {
  const R = await rows();
  const r = opt.r || (log.cid && R.find(x => x.cid === log.cid)) || await findResort(log.pts); if (!r) throw new Error("近くにスキー場がありません");
  const d = opt.d || await course(r); if (!d) throw new Error(r.nm + " のコースのデータがありません");
  const proj = makeProj(r.c), { P, Lf } = courseXZ(d, proj);
  const raw = log.pts.filter(p => hdist(r.c, [p[1], p[2]]) < 9000);
  if (raw.length < 10) throw new Error("スキー場の中の記録がほとんどありません");
  let dem = opt.dem;
  if (!dem) { let la0 = 90, la1 = -90, lo0 = 180, lo1 = -180; for (const p of raw) { la0 = Math.min(la0, p[1]); la1 = Math.max(la1, p[1]); lo0 = Math.min(lo0, p[2]); lo1 = Math.max(lo1, p[2]); }
    dem = await loadDem([la1 + .003, lo0 - .004], [la0 - .003, lo1 + .004], 14, 36); }
  const pt = raw.map(p => { const [x, z] = proj.fromLL(p[1], p[2]); return { t: p[0], la: p[1], lo: p[2], x, z, e: dem(p[1], p[2]) }; });
  const n = pt.length;
  // 速さ（前後3秒）・上下の速さ（前後20秒）。60秒以上の切れ目はまたがない
  const brk = new Uint8Array(n); for (let i = 1; i < n; i++) if (pt[i].t - pt[i - 1].t > 60000) brk[i] = 1;
  const seg = new Int32Array(n); for (let i = 1; i < n; i++) seg[i] = seg[i - 1] + brk[i];
  const win = (i, ms) => { let a = i, b = i; while (a > 0 && seg[a - 1] === seg[i] && pt[i].t - pt[a - 1].t <= ms) a--; while (b < n - 1 && seg[b + 1] === seg[i] && pt[b + 1].t - pt[i].t <= ms) b++; return [a, b]; };
  const cum = new Float64Array(n); for (let i = 1; i < n; i++) { const dd = brk[i] ? 0 : Math.hypot(pt[i].x - pt[i - 1].x, pt[i].z - pt[i - 1].z); cum[i] = cum[i - 1] + (dd / Math.max(.5, (pt[i].t - pt[i - 1].t) / 1000) > 45 ? 0 : dd); }
  for (let i = 0; i < n; i++) { const [a, b] = win(i, 3000), dt = (pt[b].t - pt[a].t) / 1000; pt[i].v = dt > 0 ? Math.min(40, (cum[b] - cum[a]) / dt) : 0;
    const [c, e] = win(i, 20000), dt2 = (pt[e].t - pt[c].t) / 1000; pt[i].vz = dt2 > 5 ? (pt[e].e - pt[c].e) / dt2 : 0; }
  // 上り(U)・下り(D)・平ら(F) → 短い区切りは前に混ぜる
  let parts = []; for (let i = 0; i < n; i++) { const k = pt[i].vz > .3 ? "U" : pt[i].vz < -.25 ? "D" : "F"; const l = parts[parts.length - 1]; if (l && l.k === k && !brk[i]) l.b = i; else parts.push({ k, a: i, b: i }); }
  for (let it = 0; it < 3; it++) { const o = []; for (const p of parts) { const l = o[o.length - 1]; if (l && !brk[p.a] && (pt[p.b].t - pt[p.a].t < 25000 || l.k === p.k)) l.b = p.b; else o.push({ ...p }); } parts = o; }
  // リフト：上りで 30m 以上・1分以上。リフトの線から遠い上りは「登り」
  const lifts = parts.filter(p => p.k === "U" && pt[p.b].e - pt[p.a].e >= 30 && pt[p.b].t - pt[p.a].t >= 60000).map(p => {
    let best = null, bd = 80; for (const o of Lf) { let s = 0, m = 0; for (let i = p.a; i <= p.b; i += 3) { let dm = 1e9; for (let j = 1; j < o.q.length; j++) dm = Math.min(dm, segDist([pt[i].x, pt[i].z], o.q[j - 1], o.q[j])); s += dm; m++; } if (s / m < bd) { bd = s / m; best = o; } }
    return { kind: "lift", a: p.a, b: p.b, nm: best ? best.nm || "リフト" : "登り", walk: !best, rise: pt[p.b].e - pt[p.a].e }; });
  // 滑走：リフトとリフトの間で、最初に下り始めてから最後に下り終わるまで（下り 30m 以上）
  const runs = []; const bounds = [-1, ...lifts.flatMap(l => [l.a, l.b]), n];

// 選んだ1本（または転倒の所）に寄る

/* ---- リプレイ ---- */

$("spdC").innerHTML = MULTS.map(m => `<button class="chip${m === mult ? " on" : ""}" data-m="${m}">${m}倍</button>`).join("") + `<button class="chip" id="fo">追いかける</button><span class="now" id="now"></span>`;
$("spdC").onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.id === "fo") { follow = !follow; b.classList.toggle("on", follow); if (follow && A3 && RP) A3.aim(RP.mk.position); return; }
